name: Import existing release assets

on:
  repository_dispatch:
    types:
      - import-existing-release

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      RELEASE_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download assets and create release
        shell: bash
        run: |
          set -euo pipefail
          tag=$(jq -r '.tag' <<< "$RELEASE_PAYLOAD")
          title=$(jq -r '.title' <<< "$RELEASE_PAYLOAD")
          prerelease=$(jq -r '.prerelease' <<< "$RELEASE_PAYLOAD")
          [[ "$tag" =~ ^(desktop-v|v)[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$prerelease" == 'true' || "$prerelease" == 'false' ]]
          [[ -n "$title" && "$title" != 'null' ]]
          mkdir release-assets
          while IFS= read -r asset; do
            name=$(base64 --decode <<< "$asset" | jq -r '.name')
            url=$(base64 --decode <<< "$asset" | jq -r '.url')
            [[ "$name" =~ ^[A-Za-z0-9._+-]+$ ]]
            [[ "$url" == https://release-assets.githubusercontent.com/* ]]
            curl --fail --silent --show-error --location "$url" --output "release-assets/$name"
          done < <(jq -r '.assets[] | @base64' <<< "$RELEASE_PAYLOAD")
          test "$(find release-assets -type f | wc -l)" -gt 0
          prerelease_args=()
          if [[ "$prerelease" == 'true' ]]; then
            prerelease_args+=(--prerelease)
          fi
          gh release create "$tag" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "$title" \
            --notes "从原发行位置迁移的历史版本。后续版本由私有源码仓库的发布工作流直接生成。" \
            "${prerelease_args[@]}"
